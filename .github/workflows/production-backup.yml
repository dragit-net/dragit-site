# Automatic production backup tag.
#
# Publishing itself is handled by GitHub Pages (source: branch `main`, folder `/`,
# custom domain via the CNAME file) - a push to `main` is the deploy trigger, so no
# Actions-based deploy job is used here (switching the Pages source to "GitHub Actions"
# is a repository setting change and is intentionally NOT required by this workflow).
#
# This workflow only guarantees the rollback anchor: it tags the commit that was live
# BEFORE the push, as `production-backup-<UTC date>-<short sha>`.
name: Production backup tag

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  tag-previous:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the previously published commit
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          # First push / branch creation: no previous state to back up.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit on main (initial push) - nothing to back up."
            exit 0
          fi

          # The previous commit is normally reachable from the new tip; if the history
          # was force-pushed the object may be absent, in which case we skip loudly
          # instead of failing the run.
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::warning::Previous commit ${BEFORE} is not reachable in this checkout - skipping backup tag."
            exit 0
          fi

          SHORT="$(git rev-parse --short "$BEFORE")"
          TAG="production-backup-$(date -u +%Y%m%d)-${SHORT}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin - nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automatic production backup: state of main before ${AFTER}."
          git push origin "refs/tags/${TAG}"

          echo "Backup tag created: ${TAG} -> ${BEFORE}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production backup"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Published commit (after push) | \`${{ github.event.after }}\` |"
            echo "| Backed up commit (before push) | \`${{ github.event.before }}\` |"
            echo "| Live site | https://www.dragit.net/ |"
          } >> "$GITHUB_STEP_SUMMARY"
